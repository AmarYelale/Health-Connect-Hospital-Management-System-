spring.application.name=health-connect-backend

# Server Port
server.port=8080

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/health_connect?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=manager
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configurations ( secret - at least 256 bits/32 bytes)
healthconnect.app.jwtSecret=====================HealthConnectSecretKeyForJWTAuthentication2026====================
healthconnect.app.jwtExpirationMs=3600000


# File upload properties (for PDF lab reports)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB